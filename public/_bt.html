<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background:#0e3a55; margin:0; padding:20px; font-family:sans-serif; }
  .lbl { color:#fff; font-size:13px; margin:18px 0 4px; }
  .btn { position:relative; width:218px; height:126px; }
  .bi { position:absolute; inset:0; border-style:solid; border-color:transparent;
        border-image-source:url(/UI/summon/079863ce6e7dace8.webp);
        border-image-slice:0 99 fill; border-image-width:0px 81.86px; border-image-repeat:stretch; }
  .zoom { zoom:0.72; }
  .scale { transform:scale(0.72); transform-origin:top left; }
  .imgfill { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; }
</style>
</head>
<body>
  <div class="lbl">A — zoom:0.72 + border-image (current; broken in FF)</div>
  <div class="zoom"><div class="btn"><div class="bi"></div></div></div>

  <div class="lbl">B — transform:scale(0.72) + border-image (does FF render?)</div>
  <div class="scale"><div class="btn"><div class="bi"></div></div></div>

  <div class="lbl">C — zoom:0.72 + stretched &lt;img&gt; (does a plain img survive zoom?)</div>
  <div class="zoom"><div class="btn"><img class="imgfill" src="/UI/summon/079863ce6e7dace8.webp"></div></div>
</body>
</html>
